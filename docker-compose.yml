name: saakshi

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: saakshi
      POSTGRES_PASSWORD: saakshi
      POSTGRES_DB: saakshi
    # The image default is max_connections=100, which DATABASE_POOL_MAX=50 plus a second API
    # instance plus psql exhausts — and the failure mode is misleading: the API returns 500s that
    # look like application errors while the log says `FATAL: sorry, too many clients already`.
    # 300 leaves room for several instances, the workers, and a human with a psql session.
    command: ['-c', 'max_connections=300']
    ports: ['5432:5432']
    volumes:
      - 'dbdata:/home/postgres/pgdata/data'
      # Runs once, only when the data directory is empty. See db/init/00-extensions.sql.
      - './db/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saakshi']
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    ports: ['6379:6379']
    volumes: ['valkeydata:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: saakshi
      MINIO_ROOT_PASSWORD: saakshi-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      retries: 20

  # One-shot: create the evidence bucket so a clean clone needs no console click.
  minio-init:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 saakshi saakshi-dev-secret &&
      mc mb --ignore-existing local/saakshi-evidence &&
      mc ls local
      "
    restart: 'no'

  # Stream gateway / federation adapter target.
  # Same tool the organisers use to serve the sandbox: RTSP in -> HLS/WHEP out.
  mediamtx:
    # The `-ffmpeg` tag is Alpine-based. The plain `latest` tag is built FROM scratch: it has no
    # shell and no wget, so a container healthcheck is impossible on it (verified 2026-09-04).
    # The bundled ffmpeg also serves the video wall's transcode paths (D3-07).
    image: bluenviron/mediamtx:latest-ffmpeg
    # Config file rather than env vars, because the adapter tests need a *seeded source*
    # (`saakshi-test`) that MTX_* variables cannot express. See ops/mediamtx/mediamtx.yml — without
    # it, the RTSP/ONVIF/WHEP adapters could only be claimed, not verified.
    volumes:
      - './ops/mediamtx/mediamtx.yml:/mediamtx.yml:ro'
    ports:
      - '8554:8554' # RTSP
      - '8889:8889' # WebRTC / WHEP
      - '8888:8888' # HLS
      - '8189:8189/udp' # WebRTC media
      - '9998:9998' # Prometheus metrics (auth-gated) — consumed by D3-10
    healthcheck:
      # TCP liveness on the primary ingest port. /metrics is auth-gated and returns 401, so it is
      # not a usable probe target.
      test: ['CMD', 'nc', '-z', '127.0.0.1', '8554']
      interval: 5s
      retries: 20

  # ── Observability (D3-10) ─────────────────────────────────────────────────────────────────────
  # At 80,000 cameras operability is the product: a system nobody can monitor is a system nobody
  # runs. Both services are configured entirely from files in `ops/`, so a fresh clone gets the same
  # dashboards and the same alert rules with no console click. See docs/observability.md.
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 15 days is enough to answer "was it like this yesterday" and small enough that the volume
      # never becomes a thing anybody has to think about on a laptop.
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports: ['9090:9090']
    volumes:
      - './ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './ops/prometheus/rules.yml:/etc/prometheus/rules.yml:ro'
      - 'promdata:/prometheus'
    # The API and both Python workers run on the HOST, not in this network — they are the code under
    # development, and containerising them would mean an image rebuild per edit. Docker Desktop
    # resolves `host.docker.internal` already; this line gives Linux the same name.
    extra_hosts: ['host.docker.internal:host-gateway']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:9090/-/healthy || exit 1']
      interval: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: saakshi
      # A local operations console, not a public one. Anonymous viewing keeps a demo one click away
      # while every edit still needs the admin login — and `allowUiUpdates: false` in the dashboard
      # provider means a browser edit could not be saved anyway.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # Off: this stack must work on a machine with no internet, and a plugin fetched at boot is a
      # dependency nobody declared.
      GF_INSTALL_PLUGINS: ''
    # 3000 is `next dev`'s port, so the host side is overridable and defaults to 3001.
    ports: ['${GRAFANA_HOST_PORT:-3001}:3000']
    volumes:
      - './ops/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './ops/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - 'grafanadata:/var/lib/grafana'
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3000/api/health || exit 1']
      interval: 5s
      retries: 20

  # Travel-time / road-graph engine for route reconstruction (D3-01).
  # Prepare once with `./scripts/import-osm.sh`, which downloads the extract, clips it to Gujarat,
  # builds the graph and fills `road_network`. See docs/road-network-setup.md.
  # (Geofabrik has no standalone gujarat extract; the script derives one from western-zone.)
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/gujarat-latest.osrm
    volumes: ['./data:/data']
    # 5000 by default. Overridable because macOS binds :5000 to the AirPlay Receiver, so a laptop
    # with it enabled cannot publish this port at all - see docs/road-network-setup.md.
    ports: ['${OSRM_HOST_PORT:-5000}:5000']
    profiles: ['routing']

volumes:
  dbdata:
  valkeydata:
  miniodata:
  promdata:
  grafanadata:
