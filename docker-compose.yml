name: saakshi

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: saakshi
      POSTGRES_PASSWORD: saakshi
      POSTGRES_DB: saakshi
    ports: ["5432:5432"]
    volumes: ["dbdata:/home/postgres/pgdata/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saakshi"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    ports: ["6379:6379"]
    volumes: ["valkeydata:/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: saakshi
      MINIO_ROOT_PASSWORD: saakshi-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  # Stream gateway / federation adapter target.
  # Same tool the organisers use to serve the sandbox: RTSP in -> HLS/WHEP out.
  mediamtx:
    image: bluenviron/mediamtx:latest
    environment:
      MTX_PROTOCOLS: tcp
    ports:
      - "8554:8554"   # RTSP
      - "8889:8889"   # WebRTC / WHEP
      - "8888:8888"   # HLS

  # Travel-time / road-graph engine for route reconstruction.
  # Prepare once:
  #   mkdir -p data && cd data
  #   curl -O https://download.geofabrik.de/asia/india/gujarat-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-extract -p /opt/car.lua /data/gujarat-latest.osm.pbf
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-partition /data/gujarat-latest.osrm
  #   docker run -t -v "$PWD:/data" osrm/osrm-backend osrm-customize /data/gujarat-latest.osrm
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld /data/gujarat-latest.osrm
    volumes: ["./data:/data"]
    ports: ["5000:5000"]
    profiles: ["routing"]

volumes:
  dbdata:
  valkeydata:
  miniodata:
